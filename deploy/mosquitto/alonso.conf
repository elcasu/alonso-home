# Plantilla de referencia. En la Pi la escribe scripts/pi/setup-mosquitto.sh
# (incluye listeners para LAN y docker0). No copiar a mano salvo emergencia.
#
# MQTT solo en interfaces locales/LAN/AP/docker. No en WAN/4G.
bind_interfaces
listener 1883 127.0.0.1
listener 1883 192.168.4.1
allow_anonymous false
password_file /etc/mosquitto/passwords/alonso
persistence true
persistence_location /var/lib/mosquitto/
log_type error
log_type warning
