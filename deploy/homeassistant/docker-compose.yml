# Home Assistant (+ Mosquitto opcional) de alonso-home.
# Separado del PoC de voz (alonso-ha-poc, :8123).
#
# Mosquitto del compose solo con profile local-mqtt (Mac/dev).
# En la Pi: MQTT_MODE=host → broker del sistema, sin publicar :1883.
name: alonso-home-ha

services:
  mosquitto:
    profiles: ["local-mqtt"]
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  homeassistant:
    # Versión fija: tuya-local pide HA >= 2026.8. No usar :stable para no mover el PoC de voz.
    image: ghcr.io/home-assistant/home-assistant:2026.10.1
    restart: unless-stopped
    ports:
      - "${HA_PORT:-8124}:8123"
    extra_hosts:
      # Para que HA (bridge) alcance el Mosquitto del host en la Pi.
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./ha-config:/config

volumes:
  mosquitto_data:
