; ESP32 + relé(s) para zonas lejanas. MQTT hacia la Pi (192.168.4.1).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
build_flags =
  -DDEVICE_ID=\"esp-bathroom\"
extra_scripts =
  post:generate_compile_commands.py
